name: Profile Engine (Spotify + Snake)

on:
  schedule:
    - cron: "0 */3 * * *" # Runs every 3 hours
  workflow_dispatch:      # Allows manual 1-click trigger in Actions tab
  push:
    branches:
      - dev
      - main

permissions:
  contents: write

jobs:
  build-widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Spotify Playlist Card
        run: python3 scripts/spotify_card.py


      - name: Generate Catppuccin Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#cba6f7&color_dots=#232634,#45475a,#74c7ec,#89b4fa,#a6e3a1
            dist/snake-light.svg?palette=github-light&color_snake=#8839ef&color_dots=#ebedf0,#cceeff,#74c7ec,#89b4fa,#40a02b

      - name: Deploy widgets to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
